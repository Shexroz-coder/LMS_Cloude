services:
  # ─── PostgreSQL Database ──────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lms_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-lms_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-lms_password}
      - POSTGRES_DB=${POSTGRES_DB:-lms_robotic}
    # PostgreSQL xotira optimallashtirish + Toshkent vaqt zonasi
    command: >
      postgres
      -c timezone=Asia/Tashkent
      -c log_timezone=Asia/Tashkent
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c effective_cache_size=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=8MB
      -c log_min_duration_statement=2000
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user} -d ${POSTGRES_DB:-lms_robotic}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (cache + sessions) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: unless-stopped
    env_file: .env
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redispassword}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save ""
    volumes:
      - redis_data:/data
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # connection_limit — Prisma pool PostgreSQL max_connections ga mos
      DATABASE_URL: postgresql://${POSTGRES_USER:-lms_user}:${POSTGRES_PASSWORD:-lms_password}@postgres:5432/${POSTGRES_DB:-lms_robotic}?connection_limit=10&pool_timeout=20
      REDIS_URL: redis://:${REDIS_PASSWORD:-redispassword}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeme_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-superrefreshsecret_changeme_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      UPLOAD_DIR: /app/uploads
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:-}
      # Node.js heap limit — OOM (xotira to'lishi) dan saqlash
      NODE_OPTIONS: "--max-old-space-size=512"
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 256M
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Frontend (Nginx) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: lms_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt/live/roboticedu.uz/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/roboticedu.uz/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      - /etc/letsencrypt/archive/roboticedu.uz:/etc/letsencrypt/archive/roboticedu.uz:ro
    depends_on:
      - backend
    networks:
      - lms_network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: lms_postgres_data
  redis_data:
    name: lms_redis_data
  uploads_data:
    name: lms_uploads_data

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  lms_network:
    name: lms_network
    driver: bridge
